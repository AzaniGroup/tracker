{% extends 'base.html' %}

{% block title %}Edit Subcontractor - Azani Project Tracker{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <!-- Breadcrumb & Header -->
    <div class="flex items-center gap-2 text-xs font-semibold text-gray-500 uppercase tracking-wider">
        <a href="{% url 'contractors:contractor_list' %}"
            class="hover:text-[#bfa12c] transition duration-150">Subcontractors</a>
        <span class="material-symbols-outlined text-sm">chevron_right</span>
        <span class="text-gray-900">Edit Subcontractor</span>
    </div>

    <div class="pb-4 border-b border-gray-200">
        <h1 class="text-3xl font-bold tracking-tight text-gray-900">Edit Subcontractor</h1>
        <p class="text-sm text-gray-500 mt-1">Modify details for subcontractor <strong>{{ subcontractor.name }}</strong>.</p>
    </div>

    <!-- Form Card -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <form method="POST" class="p-6 space-y-6">
            {% csrf_token %}

            <div class="space-y-4">
                <!-- Name Field -->
                <div class="space-y-1">
                    <label for="id_name" class="block text-sm font-semibold text-gray-700">Subcontractor Name *</label>
                    <input type="text" name="name" id="id_name" required value="{{ subcontractor.name }}"
                        placeholder="e.g. Acme Transport Ltd"
                        class="block w-full px-4 py-2.5 border border-gray-300 rounded-lg bg-gray-50 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#bfa12c] focus:border-[#bfa12c] text-sm text-gray-900 transition duration-150">
                </div>

                <!-- Company Type Field -->
                <div class="space-y-1">
                    <label for="id_company_type" class="block text-sm font-semibold text-gray-700">Company Type
                        *</label>
                    <select name="company_type" id="id_company_type" required
                        class="block w-full px-3 py-2.5 border border-gray-300 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-[#bfa12c] focus:border-[#bfa12c] text-sm text-gray-900 transition duration-150">
                        <option value="INTERNAL" {% if subcontractor.company_type == 'INTERNAL' %}selected{% endif %}>Our
                            Company (Internal Team)</option>
                        <option value="EXTERNAL" {% if subcontractor.company_type == 'EXTERNAL' %}selected{% endif %}>
                            Outside Subcontractor</option>
                    </select>
                </div>

            </div>

            <!-- Form Actions -->
            <div class="flex items-center justify-end gap-3 pt-6 border-t border-gray-150">
                <a href="{% url 'contractors:contractor_list' %}"
                    class="px-5 py-2.5 border border-gray-350 rounded-lg text-sm font-semibold text-gray-700 bg-white hover:bg-gray-50 transition duration-150">
                    Cancel
                </a>
                <button type="submit"
                    class="px-6 py-2.5 rounded-lg shadow-md text-sm font-semibold text-white gold-bg gold-bg-hover transition duration-150">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
